<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutraPLM · 功能性食品原料研发与产品全生命周期管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e1f19;--ink2:#31443c;--muted:#6b7c75;--line:#e3eae6;--bg:#f3f6f4;--card:#fff;
  --brand:#0e8f5f;--brand-d:#0a6f49;--brand-l:#e7f6ee;
  --warn:#b8740a;--danger:#cf3b3b;--info:#2361c9;--purple:#6d4bc0;
  --r:12px;--sh:0 1px 2px rgba(16,40,32,.05),0 10px 28px -18px rgba(16,40,32,.35);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.app{display:grid;grid-template-columns:238px 1fr;height:100vh;overflow:hidden}

/* ---------- sidebar ---------- */
.side{background:linear-gradient(180deg,#0d1f19 0%,#0a1712 100%);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px 16px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#16b877,#0a7a50);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:-.5px;box-shadow:0 4px 14px -4px rgba(22,184,119,.7)}
.brand b{color:#eaf6f0;font-size:15px;letter-spacing:.2px;display:block;line-height:1.25}
.brand span{color:#7d9a8d;font-size:11px;letter-spacing:.4px}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav .group{color:#5d7a6d;font-size:10.5px;letter-spacing:1.2px;padding:12px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#a9c2b6;
  text-decoration:none;font-size:13.5px;cursor:pointer;transition:.16s;margin-bottom:2px}
.nav a svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#e6f4ec}
.nav a.on{background:linear-gradient(90deg,rgba(22,184,119,.22),rgba(22,184,119,.06));color:#fff;
  box-shadow:inset 2px 0 0 #16b877}
.nav a .dot{margin-left:auto;background:#16b877;color:#04241a;font-size:10.5px;font-weight:700;
  border-radius:9px;padding:0 6px;line-height:16px;height:16px}
.side-foot{padding:12px 16px 14px;border-top:1px solid rgba(255,255,255,.07);color:#5f7d6f;font-size:11px;line-height:1.6}
.side-foot b{color:#94b3a4;font-weight:600}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.top{height:56px;flex:0 0 56px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px}
.crumb{color:var(--muted);font-size:12.5px}
.crumb b{color:var(--ink);font-weight:600;font-size:13.5px}
.top .spacer{flex:1}
.gsearch{position:relative}
.gsearch input{width:250px;height:33px;border:1px solid var(--line);background:#f7faf8;border-radius:8px;
  padding:0 11px 0 32px;font-size:13px;color:var(--ink);outline:none;transition:.16s}
.gsearch input:focus{border-color:#9fd6bd;background:#fff;box-shadow:0 0 0 3px rgba(22,184,119,.12);width:290px}
.gsearch svg{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:#90a49b;fill:none;stroke-width:2}
.today{color:var(--muted);font-size:12.5px;white-space:nowrap}
.me{display:flex;align-items:center;gap:8px}
.me .av{width:29px;height:29px;border-radius:50%;background:linear-gradient(145deg,#16b877,#0a7a50);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700}
.me .nm{font-size:12.5px;color:var(--ink2);line-height:1.2}
.me .nm i{display:block;font-style:normal;color:var(--muted);font-size:10.5px}

.view{flex:1;overflow-y:auto;padding:20px 22px 56px}
.view::-webkit-scrollbar,.nav::-webkit-scrollbar{width:9px}
.view::-webkit-scrollbar-thumb{background:#cfdad4;border-radius:9px;border:3px solid var(--bg)}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}

/* ---------- common ---------- */
.page{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page h1{font-size:20px;letter-spacing:-.2px;font-weight:700}
.page p{color:var(--muted);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.card-h h3{font-size:13.5px;font-weight:650}
.card-h .sub{color:var(--muted);font-size:11.5px}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 13px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c3d3cb;background:#f8fbf9}
.btn.primary{background:linear-gradient(180deg,#12a56d,#0b8557);border-color:#0b8557;color:#fff;font-weight:600;
  box-shadow:0 2px 8px -3px rgba(14,143,95,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f1f5f3;color:var(--ink2)}
.btn.danger{color:var(--danger);border-color:#f0d4d4}
.btn.danger:hover{background:#fdf3f3}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:19px}
.t-green{background:#e6f6ee;color:#0a6f49}
.t-blue{background:#e9f0fd;color:#1d4ed8}
.t-amber{background:#fdf2dd;color:#9a6206}
.t-red{background:#fceaea;color:#b02a2a}
.t-gray{background:#eef2f0;color:#5a6b63}
.t-purple{background:#efeafb;color:#5b3fa8}
.t-teal{background:#e2f4f5;color:#0d6d72}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .c{background:#f2f6f4;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--ink2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.b:before{background:#2361c9}.kpi.a:before{background:#d99114}.kpi.p:before{background:#6d4bc0}.kpi.t:before{background:#0d8f8f}
.kpi .lb{color:var(--muted);font-size:12px}
.kpi .vl{font-size:25px;font-weight:750;letter-spacing:-.6px;line-height:1.25;margin-top:2px}
.kpi .vl small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .fo{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi .fo em{font-style:normal;color:var(--brand);font-weight:650}
.kpi a{position:absolute;inset:0;cursor:pointer}

.grid2{display:grid;grid-template-columns:1.32fr 1fr;gap:14px;margin-bottom:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.bar-row .nm{width:66px;color:var(--ink2);flex:0 0 66px}
.bar-row .tr{flex:1;height:9px;background:#f0f4f2;border-radius:9px;overflow:hidden}
.bar-row .fl{height:100%;border-radius:9px;transition:width .5s}
.bar-row .vl{width:30px;text-align:right;color:var(--muted);flex:0 0 30px;font-variant-numeric:tabular-nums}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:20px}
.dw{position:relative;flex:0 0 124px;width:124px;height:124px}
.dctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dctr b{display:block;font-size:20px;font-weight:750;letter-spacing:-.6px;line-height:1.15}
.dctr span{font-size:10.5px;color:var(--muted)}
.donut{width:124px;height:124px;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 39px,#000 39.5px);mask:radial-gradient(circle,transparent 39px,#000 39.5px)}
.donut-hole{position:absolute;inset:0;display:grid;place-content:center;text-align:center;border-radius:50%;
  -webkit-mask:none;mask:none;background:transparent}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px;color:var(--ink2)}
.legend .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.legend .nn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .vv{color:var(--muted);font-variant-numeric:tabular-nums}

/* todo list */
.todo{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.todo:last-child{border-bottom:none;padding-bottom:0}
.todo .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 26px;font-size:12px;font-weight:700}
.todo .tt{font-size:13px;color:var(--ink);line-height:1.45}
.todo .mm{font-size:11.5px;color:var(--muted);margin-top:1px}
.todo .go{margin-left:auto;flex:0 0 auto}

/* timeline */
.tl{position:relative;padding-left:16px}
.tl:before{content:"";position:absolute;left:3px;top:6px;bottom:4px;width:1px;background:var(--line)}
.tl .it{position:relative;padding-bottom:13px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{content:"";position:absolute;left:-16px;top:5px;width:7px;height:7px;border-radius:50%;
  background:#fff;border:2px solid #b9cdc3}
.tl .it.hi:before{border-color:var(--brand);background:var(--brand)}
.tl .it .tx{font-size:12.5px;color:var(--ink2);line-height:1.45}
.tl .it .tx b{color:var(--ink);font-weight:600}
.tl .it .tm{font-size:11px;color:#93a49c;margin-top:1px}

/* table */
.tools{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools .spacer{flex:1}
.srch{position:relative}
.srch input{height:31px;border:1px solid var(--line);border-radius:7px;padding:0 10px 0 28px;font-size:12.5px;
  outline:none;width:200px;background:#fbfdfc;color:var(--ink)}
.srch input:focus{border-color:#9fd6bd;background:#fff;box-shadow:0 0 0 3px rgba(22,184,119,.1)}
.srch svg{position:absolute;left:9px;top:8px;width:14px;height:14px;stroke:#93a69d;fill:none;stroke-width:2}
select.sel{height:31px;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:12.5px;
  background:#fbfdfc;color:var(--ink2);outline:none;cursor:pointer}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px}
thead th{background:#f8faf9;color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.3px;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:9px 12px;border-bottom:1px solid #eff4f1;vertical-align:middle;color:var(--ink2)}
tbody tr:hover td{background:#fafdfb}
tbody tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#4d635a;white-space:nowrap}
td .nm{color:var(--ink);font-weight:550}
td .sub2{color:var(--muted);font-size:11.5px}
.tb-wrap{overflow:auto;max-height:calc(100vh - 300px)}
.acts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:13px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);
  cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.pc:hover{transform:translateY(-2px);border-color:#c6dbd1;box-shadow:0 12px 26px -16px rgba(16,40,32,.4)}
.pc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc .cd{font-family:ui-monospace,monospace;font-size:11px;color:#8b9d95;letter-spacing:.3px}
.pc h4{font-size:14px;font-weight:650;margin:3px 0 9px;line-height:1.4}
.pc .mt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.pc .pb{height:7px;background:#f0f4f2;border-radius:9px;overflow:hidden}
.pc .pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#16b877,#0a7a50)}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:11.5px;color:var(--muted)}
.pc .stg{position:absolute;right:-1px;top:0;padding:3px 9px;border-bottom-left-radius:8px;font-size:11px;font-weight:600}

/* tree */
.tree{font-size:12.8px}
.tnode{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 88px 58px;gap:6px;align-items:center;
  padding:6px 8px;border-radius:6px;border-bottom:1px solid #f2f6f4}
.tnode:hover{background:#f7fbf9}
.tnode.head{color:var(--muted);font-size:11px;font-weight:600;background:#f8faf9;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.tnode .lbl{display:flex;align-items:center;gap:6px;min-width:0}
.tnode .lbl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:550}
.tnode .lbl .cd{font-family:ui-monospace,monospace;font-size:11px;color:#93a49c}
.tnode .q{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tnode .pr{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tnode .sm{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.tnode .op{display:flex;gap:2px;justify-content:flex-end;opacity:.35;transition:.15s}
.tnode:hover .op{opacity:1}
.tgl{width:15px;height:15px;flex:0 0 15px;border-radius:4px;display:grid;place-items:center;cursor:pointer;
  color:#7f948b;font-size:10px;background:#f0f5f2;border:1px solid #e2ebe6;user-select:none}
.tgl.sp{visibility:hidden}
.tgl:hover{background:#e3efe9;color:#0a6f49}
.sum{display:flex;justify-content:flex-end;gap:26px;padding:11px 12px 0;border-top:1px solid var(--line);margin-top:6px;font-size:12.5px;color:var(--muted)}
.sum b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}

/* steps */
.steps{display:flex;align-items:center;gap:0;margin:2px 0 16px;overflow-x:auto;padding-bottom:2px}
.step{display:flex;align-items:center;gap:7px;font-size:12px;color:#9aaba3;white-space:nowrap}
.step .cr{width:21px;height:21px;border-radius:50%;border:1.5px solid #dbe5e0;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:#fff;color:#9aaba3}
.step.done{color:#0a6f49}.step.done .cr{background:#e6f6ee;border-color:#9ed9bf;color:#0a6f49}
.step.cur{color:var(--ink);font-weight:650}.step.cur .cr{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 0 0 3px rgba(14,143,95,.16)}
.step .ln{width:26px;height:1px;background:#e2ebe6;margin:0 8px}
.step.done .ln{background:#9ed9bf}
.apv{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px}
.apv .rl{width:52px;font-size:12px;color:var(--muted);flex:0 0 52px}
.apv .us{font-size:12.8px;color:var(--ink);flex:1}
.apv .dt{font-size:11.5px;color:#9aaba3}
.apv.pend{border-style:dashed;background:#fffdf7}

/* modal */
.mask{position:fixed;inset:0;background:rgba(10,26,20,.42);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .18s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 30px 70px -20px rgba(8,30,22,.5);animation:mi .2s cubic-bezier(.2,.8,.3,1)}
@keyframes mi{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.modal.wide{width:860px}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.m-h h3{font-size:15px;font-weight:680}
.m-h .x{width:28px;height:28px;border:none;background:#f4f7f5;border-radius:7px;font-size:17px;color:#8ba096;cursor:pointer;line-height:1}
.m-h .x:hover{background:#eef3f0;color:var(--ink2)}
.m-b{padding:16px 18px;overflow-y:auto}
.m-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fbfdfc;border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:550}
.fld label i{color:var(--danger);font-style:normal}
.fld input,.fld select,.fld textarea{height:33px;border:1px solid var(--line);border-radius:7px;padding:0 10px;
  font-size:13px;color:var(--ink);outline:none;background:#fff;font-family:inherit}
.fld textarea{height:70px;padding:7px 10px;resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#8fd0b4;box-shadow:0 0 0 3px rgba(22,184,119,.12)}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-bottom:14px}
.dl .d{background:#f8faf9;border:1px solid #eef3f0;border-radius:8px;padding:8px 10px}
.dl .d span{display:block;font-size:11px;color:var(--muted)}
.dl .d b{font-size:12.8px;font-weight:600;color:var(--ink);word-break:break-all}
.sec-t{font-size:12px;font-weight:650;color:var(--ink2);margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.sec-t:before{content:"";width:3px;height:12px;border-radius:2px;background:var(--brand)}
.sec-t:first-child{margin-top:0}

/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#0e2a21;color:#e9f6ef;font-size:13px;padding:9px 16px;border-radius:9px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
  animation:ti .22s ease;display:flex;gap:8px;align-items:center}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tst .ok{color:#38d996;font-weight:700}

.note{background:#f0f8f4;border:1px solid #d8ece2;border-radius:9px;padding:11px 13px;font-size:12.5px;color:#3d5b50;line-height:1.65}
.note b{color:#0a6f49}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.8px}
.kv:last-child{border:none}
.kv span{color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini .m{background:#f8faf9;border:1px solid #eef3f0;border-radius:9px;padding:10px 12px;text-align:center}
.mini .m b{display:block;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.4px}
.mini .m span{font-size:11.5px;color:var(--muted)}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid2b{grid-template-columns:1fr}
  .app{grid-template-columns:64px 1fr}.brand b,.brand span,.nav a span,.nav .group,.side-foot{display:none}

/* v1 → v2 结构升级：补齐原辅料多库、功效/营养/法规字段与配方数据 */
function migrate(db){
  if(db.meta && db.meta.schema>=2) return db;
  const s = seed();
  (db.materials||[]).forEach(m=>{
    const sm = s.materials.find(x=>x.id===m.id);
    if(sm){ ['libId','origin','acts','nut','regs','fn','made'].forEach(k=>{ if(m[k]===undefined) m[k]=sm[k]; }); }
    if(!m.libId) m.libId='LIB1';
    if(!Array.isArray(m.acts)) m.acts=[];
    if(!Array.isArray(m.regs)) m.regs=[];
    if(!Array.isArray(m.fn)) m.fn=[];
    if(m.nut===undefined) m.nut=null;
  });
  s.materials.forEach(sm=>{ if(!db.materials.find(m=>m.id===sm.id)) db.materials.push(sm); });
  db.libs = s.libs;
  db.formulas = s.formulas;
  db.meta = Object.assign({}, s.meta, {schema:2});
  return db;
}
DB = migrate(DB);

function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');

/* ================= 成本计算 ================= */
function unitCost(n){
  if(n.children && n.children.length){
    return n.children.reduce((s,c)=> s + c.qty*unitCost(c), 0) * (1+(n.loss||0)/100);
  }
  const m = mat(n.mid);
  return m ? (m.price||0) : 0;
}
function lineCost(n){ return (n.children && n.children.length) ? n.qty*unitCost(n) : n.qty*unitCost(n)*(1+(n.loss||0)/100); }
function bomCost(bom){ return (bom||[]).reduce((s,n)=> s+lineCost(n), 0); }
function countNodes(bom){ return (bom||[]).reduce((s,n)=> s+1+countNodes(n.children), 0); }

function openModal(opt){
  const {title, body, okText='保存', size='', onOk} = opt;

  document.getElementById('modalRoot').innerHTML =
    '<div class="mask" id="mask"><div class="modal '+size+'">'

    + (onOk ? '<button class="btn primary" id="mok">'+esc(okText)+'</button>' : '')
    + '</div></div></div>';
  document.getElementById('mx').onclick = closeModal;
  document.getElementById('mc').onclick = closeModal;
  document.getElementById('mform').addEventListener('submit', e=> e.preventDefault());
  document.getElementById('mask').addEventListener('click', e=>{ if(e.target.id==='mask') closeModal(); });
  const ok = document.getElementById('mok');
  if(ok) ok.onclick = ()=>{
    const f = document.getElementById('mform');
    if(!f.reportValidity()) return;
    const data = {};
    new FormData(f).forEach((v,k)=> data[k]=v);
    const r = modalOk(data);
    if(r !== false){ closeModal(); }
  };
}

function fld(label,name,value,opt){
  opt = opt||{};
  const v = value==null?'':esc(value);
  if(opt.type==='textarea') return '<div class="fld '+(opt.full?'full':'')+'"><label>'+label+(opt.req?' <i>*</i>':'')+'</label><textarea name="'+name+'" '+(opt.req?'required':'')+' placeholder="'+esc(opt.ph||'')+'">'+v+'</textarea></div>';
  if(opt.type==='select'){
    const opts = opt.options.map(o=>{
      const val = typeof o==='object'? o.v : o, txt = typeof o==='object'? o.t : o;
      return '<option value="'+esc(val)+'" '+(String(val)===String(value)?'selected':'')+'>'+esc(txt)+'</option>';
    }).join('');
    return '<div class="fld '+(opt.full?'full':'')+'"><label>'+label+(opt.req?' <i>*</i>':'')+'</label><select name="'+name+'" '+(opt.req?'required':'')+'>'+opts+'</select></div>';
  }
  return '<div class="fld '+(opt.full?'full':'')+'"><label>'+label+(opt.req?' <i>*</i>':'')+'</label>'
    +'<input name="'+name+'" type="'+(opt.type||'text')+'" value="'+v+'" '+(opt.req?'required':'')+' placeholder="'+esc(opt.ph||'')+'" '
    +(opt.step?'step="'+opt.step+'"':'')+(opt.min!=null?'min="'+opt.min+'"':'')+'>'+'</div>';
}

      +   '<span class="nm">'+esc(m? m.name : '已删除物料')+'</span>'
      +   '<span class="cd">'+esc(m? m.code : '')+'</span>'
      + '</div>'
      + '<div class="q">'+n.qty+' '+esc(n.unit||(m?m.unit:''))+'</div>'
      + '<div class="pr">'+(hasChild? '折算 ¥'+uc.toFixed(2) : '¥'+uc.toFixed(2))+'</div>'
      + '<div class="sm">¥'+lineCost(n).toFixed(2)+'</div>'

/* ================= 视图：配方系统 ================= */
function ingPrice(id){ const m=mat(id); return m? (m.price||0) : 0; }
function itemCost(it){ return (Number(it.qty)||0) * ingPrice(it.ing) * (1+(Number(it.loss)||0)/100); }
function formulaCost(f){ return (f.items||[]).reduce((s,i)=> s+itemCost(i), 0); }
function formulaOut(f){ return (Number(f.batch)||0) * (Number(f.yieldRate)||100)/100; }
function formulaUnitCost(f){ const out=formulaOut(f); return out? formulaCost(f)/out : 0; }
function formulaPerServing(f){ const s=Number(f.servings)||0; return s? formulaCost(f)/s : 0; }
function formulaNutri(f, key){
  const solids = (f.items||[]).filter(i=>{ const m=mat(i.ing); return m && m.nut && m.unit==='kg'; });
  const totalKg = solids.reduce((s,i)=> s+(Number(i.qty)||0), 0);
  if(!totalKg) return null;
  let v=0, covered=0;
  solids.forEach(i=>{
    const m=mat(i.ing); const val = m.nut[key];
    if(val==null) return;
    v += (Number(i.qty)||0)/totalKg * Number(val);
    covered++;
  });
  return covered? v : null;
}

    return '<tr data-row data-s="'+esc((f.code+' '+f.name+' '+f.owner).toLowerCase())+'" data-status="'+esc(f.status)+'">'

      + '<td class="num">'+money(u)+'<span class="sub2">/kg</span></td>'
      + '<td class="num">'+(p? money(p)+'<span class="sub2">/'+esc(f.servingUnit||'份')+'</span>' : '—')+'</td>'

      + '<button class="btn sm danger" data-act="del-formula" data-id="'+f.id+'">删除</button></div></td></tr>';

/* 配方编辑：局部重算 */
function fxRecount(){
  const e = ui.editing; if(!e) return;
  const total = e.items.reduce((s,i)=> s+itemCost(i), 0);
  e.items.forEach((it,i)=>{
    const tr = document.querySelector('[data-fxrow="'+i+'"]'); if(!tr) return;
    const m = mat(it.ing) || {};
    const c = itemCost(it), pct = total? c/total*100 : 0;
    const set=(sel,v)=>{ const el=tr.querySelector('[data-cell="'+sel+'"]'); if(el) el.innerHTML=v; };
    set('lib', esc(libOf(m.libId).name.replace('库','')));
    set('unit', esc(m.unit||''));
    set('price', money(m.price));
    set('cost', '<b>'+money(c)+'</b>');
    set('pct', pct.toFixed(1)+'%');
    const bar = tr.querySelector('[data-cell="pctbar"]'); if(bar) bar.style.width = pct.toFixed(1)+'%';
  });
  const out = formulaOut(e);
  const map = {cost: money(total), out: num(out,1)+'<em>kg</em>', unit: money(total/(out||1))+'<em>/kg</em>',
    per: (e.servings? money(total/e.servings):'—')+'<em>/'+esc(e.servingUnit||'份')+'</em>'};
  Object.keys(map).forEach(k=>{ const el=document.querySelector('[data-sum="'+k+'"]'); if(el) el.innerHTML = map[k]; });
}

function openChange(c){
  const idx = FLOW.indexOf(c.status);
  const steps = FLOW.map((s,i)=>{
    let cls = i<idx? 'done' : (i===idx? 'cur':'');
    if(c.status==='已驳回') cls = s==='草稿'?'done':'';
    return '<div class="step '+cls+'"><div class="cr">'+(i<idx?'✓':i+1)+'</div>'+s+'</div>'+(i<FLOW.length-1?'<div class="ln"></div>':'');
  }).join('');
  const apv = (c.approvals||[]).map((a,i)=>{
    const tone = a.state==='已通过'?'t-green':(a.state==='已驳回'?'t-red':'t-gray');
    const btn = (c.status==='审批中' && a.state==='待审批')
      ? '<button class="btn sm" data-act="apv-ok" data-id="'+c.id+'" data-i="'+i+'">通过</button>'
        + '<button class="btn sm danger" data-act="apv-no" data-id="'+c.id+'" data-i="'+i+'">驳回</button>' : '';
    return '<div class="apv '+(a.state==='待审批'?'pend':'')+'"><div class="rl">'+esc(a.role)+'</div>'
      + '<div class="us">'+esc(a.user)+(a.cmt?'<div class="sub2" style="font-size:11.5px;color:var(--muted)">'+esc(a.cmt)+'</div>':'')+'</div>'
      + '<span class="dt">'+esc(a.date||'')+'</span><span class="badge '+tone+'">'+esc(a.state)+'</span>'
      + '<span class="acts">'+btn+'</span></div>';
  }).join('') || '<div class="empty" style="padding:16px">尚未提交评审</div>';

  const aff = c.affected.map(id=>{
    const m = mat(id); const p = DB.products.find(x=>x.id===id);
    const nm = m? m.name : (p? p.name : id);
    const cd = m? m.code : (p? p.code : id);
    return '<span class="c" title="'+esc(cd)+'">'+esc(nm)+'</span>';
  }).join('');

  const nextBtn = (()=>{

      return allDone? '<button class="btn primary" data-act="chg-next" data-id="'+c.id+'">全部通过 → 批准</button>' : '';
    }
    const n = map[c.status];
    return n? '<button class="btn primary" data-act="chg-next" data-id="'+c.id+'">'+n[0]+'</button>' : '';
  })();

  viewOnlyModal(c.code+' · 变更详情',
    '<div class="steps">'+steps+'</div>'

/* ================= 批量导入：原辅料 ================= */
const IMP_COLS = [
  ['code',['编码','原辅料编码','物料编码','code']],
  ['name',['名称','原辅料名称','物料名称','name']],
  ['lib',['所属库','库','原辅料库','所属原辅料库','lib']],
  ['type',['类型','物料类型','type']],
  ['spec',['规格','质量指标','spec']],
  ['unit',['单位','计量单位','unit']],
  ['price',['单价','价格','price']],
  ['sup',['主供应商','供应商','sup']],
  ['status',['状态','status']],
  ['ver',['版本','ver']],
  ['date',['更新日期','日期','date']],
  ['acts',['功效成分','功效','acts']],
  ['nut',['营养成分','营养成分表','nut']],
  ['regs',['法规依据','法规使用依据','regs']],
  ['note',['备注','note']]
];
const IMP_KEYMAP = {'能量':'e','蛋白质':'p','脂肪':'f','碳水化合物':'c','碳水':'c','糖':'s','膳食纤维':'fib','钠':'na',
  'energy':'e','protein':'p','fat':'f','carb':'c','sugar':'s','fiber':'fib','sodium':'na'};
const IMP_COLORS = ['#12a56d','#2361c9','#6d4bc0','#d99114','#0d8f8f','#cf3b3b'];

/* 解析分隔文本（自动识别逗号/制表符，支持双引号包裹与转义） */
function impParse(text){
  text = String(text||'').replace(/^\ufeff/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  if(!text) return [];
  const first = text.split('\n')[0]||'';
  const tabs=(first.match(/\t/g)||[]).length, commas=(first.match(/,/g)||[]).length;
  const delim = tabs>commas? '\t' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r=> r.some(x=>String(x).trim()!==''));
}
function impHeaderMap(head){
  const m={};
  head.forEach((h,i)=>{
    const t = String(h||'').replace(/[\s（）()]/g,'').trim().toLowerCase();
    IMP_COLS.forEach(([k,alias])=>{
      if(m[k]!==undefined) return;
      if(alias.some(a=> a.toLowerCase()===t)) m[k]=i;
    });
  });
  return m;
}
function impSplitRows(s){ return String(s||'').split(/[;；]/).map(x=>x.trim()).filter(Boolean); }
function impActs(s){
  return impSplitRows(s).map(t=>{
    const p = t.split(/[|｜]/).map(x=>x.trim());
    return [p[0]||'', p[1]||'', p[2]||''];
  }).filter(p=>p[0]);
}
function impRegs(s){
  return impSplitRows(s).map(t=>{
    const p = t.split(/[|｜]/).map(x=>x.trim());
    return [p[0]||'', p[1]||'', p[2]||'', p[3]||''];
  }).filter(p=>p[0]);
}
function impNut(s){
  const o = {e:null,p:null,f:null,c:null,s:null,fib:null,na:null}; let any=false;
  impSplitRows(s).forEach(t=>{
    const p = t.split('=');
    if(p.length<2) return;
    const k = IMP_KEYMAP[String(p[0]).replace(/[\s（）()]/g,'').toLowerCase()];
    const v = parseFloat(String(p[1]).replace(/[^\d.\-]/g,''));
    if(k && !isNaN(v)){ o[k]=v; any=true; }
  });
  return any? o : null;
}
/* 库匹配：命中返回现有库，未命中给出待新建库（确定性 id，保证预览与导入一致） */
function impLib(name){
  const raw = String(name||'').trim();
  if(!raw) return {id:(DB.libs&&DB.libs[0])? DB.libs[0].id : 'LIB1', isNew:false, name:(DB.libs&&DB.libs[0])? DB.libs[0].name : '功能性原料库'};
  const key = raw.replace(/库$/,'');
  const hit = (DB.libs||[]).find(l=> l.name.replace(/库$/,'')===key || l.id===raw || l.code===raw);
  if(hit) return {id:hit.id, isNew:false, name:hit.name};
  return {id:'LIB'+key, isNew:true, name:key+'库'};
}
function impSup(name){
  const n = String(name||'').trim(); if(!n) return '';
  const s = (DB.suppliers||[]).find(x=> x.name===n) || (DB.suppliers||[]).find(x=> x.name.includes(n) || n.includes(x.name));
  return s? s.id : '';
}
/* 解析 + 逐行校验，产出预览数据（不落库） */
function impRows(text){
  const raw = impParse(text);
  if(!raw.length) return {rows:[], headerErr:'未识别到任何数据行'};
  const map = impHeaderMap(raw[0]);
  const miss = [];
  if(map.code===undefined) miss.push('编码');
  if(map.name===undefined) miss.push('名称');
  if(miss.length) return {rows:[], headerErr:'表头缺少必需列：'+miss.join('、')+'（请用「下载模板」的表头）'};
  const seen = {}, out = [];
  for(let i=1;i<raw.length;i++){
    const r = raw[i];
    const g = k=> (map[k]!==undefined && r[map[k]]!=null)? String(r[map[k]]).trim() : '';
    const o = {line:i+1, code:g('code'), name:g('name'), libName:g('lib'), type:g('type')||'原料',
      spec:g('spec'), unit:g('unit')||'kg', price:g('price'), supName:g('sup'),
      status:['在用','试制','停用'].includes(g('status'))? g('status') : '在用',
      ver:g('ver')||'V1.0', date:g('date')||todayStr(), note:g('note'),
      acts:impActs(g('acts')), regs:impRegs(g('regs')), nut:impNut(g('nut')), errs:[]};
    if(!o.code) o.errs.push('缺少编码');
    if(!o.name) o.errs.push('缺少名称');
    if(o.price!=='' && isNaN(parseFloat(o.price))) o.errs.push('单价「'+o.price+'」不是数字');
    if(o.code){
      if(seen[o.code]) o.errs.push('文件内编码重复（第 '+seen[o.code]+' 行已出现）');
      else seen[o.code] = o.line;
    }
    const lb = impLib(o.libName);
    o.libId = lb.id; o.libNew = lb.isNew; o.libShow = lb.name;
    const exist = DB.materials.find(m=>m.code===o.code);
    o.act = o.errs.length? 'err' : (!exist? 'new' : (ui.imp && ui.imp.mode==='skip'? 'skip':'upd'));
    out.push(o);
  }
  return {rows:out};
}
function impStat(rows){
  return {total:rows.length,
    n:rows.filter(r=>r.act==='new').length, u:rows.filter(r=>r.act==='upd').length,
    s:rows.filter(r=>r.act==='skip').length, e:rows.filter(r=>r.act==='err').length};
}

      + '<td><span class="imp-res '+{new:'n',upd:'u',skip:'s',err:'e'}[r.act]+'">'+resTxt+'</span></td></tr>';
  }).join('');
  box.innerHTML = '<div class="imp-sum">'
    + '<div class="k">共<b>'+st.total+'</b>行</div>'
    + '<div class="k ok">新增<b>'+st.n+'</b></div>'
    + '<div class="k up">更新<b>'+st.u+'</b></div>'
    + '<div class="k">跳过<b>'+st.s+'</b></div>'
    + '<div class="k bad">错误<b>'+st.e+'</b></div>'
    + (st.total>50? '<div class="k">仅预览前 50 行</div>':'')+'</div>'
    + '<div class="imp-scroll"><table class="imp-tb"><thead><tr><th>行</th><th>编码</th><th>名称 / 错误</th><th>所属库</th><th>类型</th>'
    + '<th>单价</th><th>功效</th><th>法规</th><th>结果</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
}
function impTemplate(){

function impCommit(){
  const text = (document.getElementById('impText')||{}).value || '';
  const res = impRows(text);
  if(res.headerErr){ toast('表头错误：'+res.headerErr); return false; }
  const todo = res.rows.filter(r=> r.act==='new' || r.act==='upd');
  if(!todo.length){ toast('没有可导入的行（请检查错误提示）'); return false; }
  let n=0, u=0; const newLibs = {};
  todo.forEach(r=>{
    if(r.libNew) newLibs[r.libId] = r.libShow;
    const payload = {code:r.code, name:r.name, libId:r.libId, type:r.type, spec:r.spec, unit:r.unit,
      price:parseFloat(r.price)||0, sup:impSup(r.supName), status:r.status, ver:r.ver, date:r.date,
      note:r.note, acts:r.acts, regs:r.regs, nut:r.nut, fn:[], origin:'', made:false};
    if(r.act==='upd'){
      const m = DB.materials.find(x=>x.code===r.code);
      Object.assign(m, payload); u++;
    } else {
      DB.materials.push(Object.assign({id:uid('M')}, payload)); n++;
    }
  });
  Object.keys(newLibs).forEach((id,i)=>{
    if(!(DB.libs||[]).some(l=>l.id===id)){
      DB.libs.push({id, code:'LIB-'+(DB.libs.length+1), name:newLibs[id],
        color: IMP_COLORS[(DB.libs.length+i)%IMP_COLORS.length]});
    }
  });
  addLog('批量导入原辅料：新增 '+n+' 项，更新 '+u+' 项','material');
  save(); render();
  toast('导入完成：新增 '+n+' 项，更新 '+u+' 项'+(res.rows.filter(r=>r.act==='skip').length? '，跳过 '+res.rows.filter(r=>r.act==='skip').length+' 项':''));
  return true;
}

/* 事件通道：pointerdown 先行（触屏/部分预览容器只透传按下事件），click 兜底；
   同一元素 800ms 内由 pointerdown 处理过的，click 不再重复执行 */
let pdTarget = null, pdTime = 0;
document.addEventListener('pointerdown', e=>{
  pdTarget = e.target.closest('[data-act]');
  pdTime = Date.now();
  dispatchAct(e);
}, true);
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(t && t===pdTarget && Date.now()-pdTime<800) return;
  dispatchAct(e);
}, true);

/* 键盘快捷键：Alt+数字 直接切换页面（数字对应侧边栏第 N 项） */
document.addEventListener('keydown', e=>{
  if(e.altKey && e.key>='1' && e.key<='9'){
    const n = NAV[parseInt(e.key)-1];
    if(n){ e.preventDefault(); go(n.k); }
  }
});

/* 配方编辑器：行内修改即时重算 */
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-fx]');
  if(!el || !ui.editing) return;
  const i = +el.dataset.i, key = el.dataset.fx;
  const it = ui.editing.items[i];
  if(!it) return;
  if(key==='ing') it.ing = el.value;
  else if(key==='qty') it.qty = parseFloat(el.value)||0;
  else if(key==='loss') it.loss = parseFloat(el.value)||0;
  ui.dirty = true;
  fxRecount();
});

/* 筛选 */
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-filter]');
  if(!el) return;
  const key = el.dataset.filter;
  ui[key] = el.value;
  applyFilter();
});
document.addEventListener('change', e=>{
  const el = e.target.closest('select[data-filter]');
  if(!el) return;
  ui[el.dataset.filter] = el.value;
  applyFilter();
});
function applyFilter(){
  const rows = document.querySelectorAll('tbody tr[data-row]');
  if(!rows.length) return;
  let shown = 0;
  rows.forEach(tr=>{
    let ok = true;
    if(cur==='materials'){
      const q=(ui.mQ||'').toLowerCase().trim();
      ok = (!q || tr.dataset.s.includes(q)) && (!ui.mType || tr.dataset.type===ui.mType)
        && (!ui.libId || tr.dataset.lib===ui.libId);
    } else if(cur==='formulas'){
      const q=(ui.fQ||'').toLowerCase().trim();
      ok = (!q || tr.dataset.s.includes(q)) && (!ui.fStatus || tr.dataset.status===ui.fStatus);
    } else if(cur==='products'){
      const q=(ui.pQ||'').toLowerCase().trim(); ok = !q || tr.dataset.s.includes(q);
    } else if(cur==='changes'){
      const q=(ui.cQ||'').toLowerCase().trim();
      ok = (!q || tr.dataset.s.includes(q)) && (!ui.cStatus || tr.dataset.status===ui.cStatus);
    } else if(cur==='docs'){
      const q=(ui.dQ||'').toLowerCase().trim();
      ok = (!q || tr.dataset.s.includes(q)) && (!ui.dType || tr.dataset.type===ui.dType);
    } else if(cur==='suppliers'){
      const q=(ui.sQ||'').toLowerCase().trim(); ok = !q || tr.dataset.s.includes(q);
    }
    tr.style.display = ok? '':'none';
    if(ok) shown++;
  });
  const c = document.getElementById('mcount');
  if(c && cur==='materials') c.textContent = '筛选出 '+shown+' 项';
}

/* 导出工具 */
function download(name, content, mime){
  const blob = new Blob([content], {type:(mime||'text/plain')+';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function exportCSV(name, rows){
  const csv = '\ufeff' + rows.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  download(name+'-'+todayStr()+'.csv', csv, 'text/csv');
  toast('已导出 '+name+'.csv');
}
